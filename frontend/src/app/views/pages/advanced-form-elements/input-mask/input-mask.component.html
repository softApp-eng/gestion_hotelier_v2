<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Input Mask</h4>
        <p class=“text-muted”>Read the <a href="https://github.com/JsDaddy/ngx-mask" target="_blank"> Official Ngx-mask Documentation </a>for a full list of instructions and other options.</p>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12 grid-margin">
    <div class="card">
      <div class="card-body">
        <form class="forms-sample">
          <div class="row mb-3">
            <div class="col">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Date:</mat-label>
                <input matInput mask="d0/M0/0000" placeholder="dd/mm/yyyy"/>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Hour:</mat-label>
                <input matInput mask="Hh:m0:s0" placeholder="hh:mm:ss"/>
              </mat-form-field>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Date hour:</mat-label>
                <input matInput mask="d0/M0/0000 Hh:m0:s0" placeholder="dd/mm/yyyy hh:mm:ss"/>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Mixed types:</mat-label>
                <input matInput mask="AAA 000-S0S" placeholder="AAA 000-S0S" />
              </mat-form-field>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Prefix:</mat-label>
                <input matInput prefix="+7 " mask="(000) 000 00 00" [showMaskTyped] = "true" />
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Suffix (eg: $):</mat-label>
                <input matInput suffix=" $" mask="0000" />
              </mat-form-field>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Thousand separator:</mat-label>
                <input matInput mask="separator"/>
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Dot separator:</mat-label>
                <input matInput mask="separator.2" thousandSeparator="." />
              </mat-form-field>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Comma separator:</mat-label>
                <input matInput mask="separator.2" thousandSeparator="," />
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Secure input:</mat-label>
                <input matInput [hiddenInput]="true" mask="XXX/X0/0000" placeholder="XXX/X0/0000"/>
              </mat-form-field>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
