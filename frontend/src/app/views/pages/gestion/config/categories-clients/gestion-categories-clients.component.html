<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Catégories de clients</h5>
  <button class="btn btn-primary btn-sm" (click)="newCategorie()"><i class="fa-solid fa-plus me-1"></i>Nouvelle catégorie</button>
</div>

<div class="card mb-3" *ngIf="showForm">
  <div class="card-header"><b>{{ form.id ? 'Modifier' : 'Nouvelle' }} catégorie</b></div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Code</mat-label>
          <input matInput [(ngModel)]="form.code" placeholder="OFF_SUP">
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Libellé</mat-label>
          <input matInput [(ngModel)]="form.libelle" placeholder="Officier supérieur">
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Ordre</mat-label>
          <input matInput type="number" [(ngModel)]="form.ordre">
        </mat-form-field>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary btn-sm me-2" (click)="save()">Enregistrer</button>
      <button class="btn btn-light btn-sm" (click)="showForm=false">Annuler</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Ordre</th><th>Code</th><th>Libellé</th><th style="width:150px;">Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let c of categories">
          <td>{{ c.ordre }}</td>
          <td><b>{{ c.code }}</b></td>
          <td>{{ c.libelle }}</td>
          <td>
            <button class="btn btn-outline-primary btn-sm me-1" (click)="edit(c)"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-outline-danger btn-sm" (click)="remove(c)"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr *ngIf="!categories.length"><td colspan="4" class="text-center text-muted">Aucune catégorie.</td></tr>
      </tbody>
    </table>
  </div>
</div>
