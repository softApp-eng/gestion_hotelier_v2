<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Organismes (prise en charge)</h5>
  <button class="btn btn-primary btn-sm" (click)="newOrganisme()"><i class="fa-solid fa-plus me-1"></i>Nouvel organisme</button>
</div>

<div class="card mb-3" *ngIf="showForm">
  <div class="card-header"><b>{{ form.id ? 'Modifier' : 'Nouvel' }} organisme</b></div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-4"><label class="form-label">Nom</label><input class="form-control" [(ngModel)]="form.nom"></div>
      <div class="col-md-3">
        <label class="form-label">Type</label>
        <select class="form-select" [(ngModel)]="form.type">
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>
      <div class="col-md-3"><label class="form-label">Téléphone</label><input class="form-control" [(ngModel)]="form.telephone"></div>
      <div class="col-md-2 d-flex align-items-end">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="oactif" [(ngModel)]="form.actif"><label class="form-check-label" for="oactif">Actif</label></div>
      </div>
      <div class="col-md-12"><label class="form-label">Adresse</label><input class="form-control" [(ngModel)]="form.adresse"></div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary btn-sm me-2" (click)="save()">Enregistrer</button>
      <button class="btn btn-light btn-sm" (click)="showForm=false">Annuler</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Nom</th><th>Type</th><th>Téléphone</th><th>Statut</th><th style="width:150px;">Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let o of organismes">
          <td><b>{{ o.nom }}</b></td>
          <td><span class="badge bg-light text-dark border">{{ o.type }}</span></td>
          <td>{{ o.telephone }}</td>
          <td><span class="badge" [ngClass]="o.actif ? 'bg-success' : 'bg-secondary'">{{ o.actif ? 'Actif' : 'Inactif' }}</span></td>
          <td>
            <button class="btn btn-outline-primary btn-sm me-1" (click)="edit(o)"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-outline-danger btn-sm" (click)="remove(o)"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr *ngIf="!organismes.length"><td colspan="5" class="text-center text-muted">Aucun organisme.</td></tr>
      </tbody>
    </table>
  </div>
</div>
