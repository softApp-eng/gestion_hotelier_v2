<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Pavillons</h5>
  <button class="btn btn-primary btn-sm" (click)="newPavillon()"><i class="fa-solid fa-plus me-1"></i>Nouveau pavillon</button>
</div>

<div class="card mb-3" *ngIf="showForm">
  <div class="card-header"><b>{{ form.id ? 'Modifier' : 'Nouveau' }} pavillon</b></div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-2"><label class="form-label">Code</label><input class="form-control" [(ngModel)]="form.code"></div>
      <div class="col-md-4"><label class="form-label">Nom</label><input class="form-control" [(ngModel)]="form.nom"></div>
      <div class="col-md-4"><label class="form-label">Description</label><input class="form-control" [(ngModel)]="form.description"></div>
      <div class="col-md-2 d-flex align-items-end">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="actif" [(ngModel)]="form.actif"><label class="form-check-label" for="actif">Actif</label></div>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary btn-sm me-2" (click)="save()">Enregistrer</button>
      <button class="btn btn-light btn-sm" (click)="showForm=false">Annuler</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Code</th><th>Nom</th><th>Description</th><th>Statut</th><th style="width:150px;">Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let p of pavillons">
          <td><b>{{ p.code }}</b></td>
          <td>{{ p.nom }}</td>
          <td>{{ p.description }}</td>
          <td><span class="badge" [ngClass]="p.actif ? 'bg-success' : 'bg-secondary'">{{ p.actif ? 'Actif' : 'Inactif' }}</span></td>
          <td>
            <button class="btn btn-outline-primary btn-sm me-1" (click)="edit(p)"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-outline-danger btn-sm" (click)="remove(p)"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr *ngIf="!pavillons.length"><td colspan="5" class="text-center text-muted">Aucun pavillon.</td></tr>
      </tbody>
    </table>
  </div>
</div>
