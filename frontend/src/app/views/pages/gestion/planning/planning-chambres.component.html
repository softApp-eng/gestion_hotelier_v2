<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Planning des chambres</h5>
  <button class="btn btn-outline-secondary btn-sm" (click)="imprimer()"><i class="fa-solid fa-print me-1"></i>Imprimer</button>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Pavillon</label>
        <select class="form-select" [(ngModel)]="pavillonId" (ngModelChange)="load()">
          <option [ngValue]="null">Tous les pavillons</option>
          <option *ngFor="let p of pavillons" [ngValue]="p.id">{{ p.nom }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Mois</label>
        <input type="month" class="form-control" [(ngModel)]="mois" (ngModelChange)="load()">
      </div>
      <div class="col-md-6 text-md-end">
        <span class="me-3"><span class="lg-dot bg-transparent border"></span>Libre</span>
        <span class="me-3"><span class="lg-dot bg-info"></span>Réservée</span>
        <span class="me-3"><span class="lg-dot bg-danger"></span>Occupée</span>
        <span><span class="lg-dot bg-secondary"></span>Bloquée</span>
      </div>
    </div>
  </div>
</div>

<div class="card" *ngIf="planning">
  <div class="card-body p-0 rt-wrap">
    <table class="rt">
      <thead>
        <tr>
          <th class="rt-room">Chambre</th>
          <th *ngFor="let j of jours()" class="text-center">
            <div style="font-size:.62rem;color:#6c757d;">{{ jourCourt(j.date) }}</div>
            <div style="font-weight:700;">{{ numJour(j.date) }}</div>
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let g of groupes()">
          <tr class="rt-grp">
            <td [attr.colspan]="jours().length + 1">{{ g.titre }} · {{ g.nb }} chambres</td>
          </tr>
          <ng-container *ngFor="let sg of g.sous">
            <tr class="rt-sub">
              <td [attr.colspan]="jours().length + 1">{{ sg.titre }} ({{ sg.chambres.length }})</td>
            </tr>
            <tr *ngFor="let c of sg.chambres">
              <td class="rt-room"><span class="n">{{ c.numero }}</span><span class="t">{{ c.typeChambre }}</span></td>
              <td *ngFor="let r of runs(c)" [attr.colspan]="r.span" class="rt-day" [ngClass]="'st-' + r.statut"
                  [title]="tooltip(c, r)">
                <span class="rt-bar" *ngIf="r.statut !== 'LIBRE'">{{ labelFor(r) }}</span>
              </td>
            </tr>
          </ng-container>
        </ng-container>
        <tr *ngIf="!planning.chambres.length">
          <td [attr.colspan]="jours().length + 1" class="text-center text-muted py-3">Aucune chambre.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="text-muted small mt-2" *ngIf="loading"><i class="fa-solid fa-spinner fa-spin me-1"></i>Chargement…</div>
