<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Tickets repas</h5>
  <button class="btn btn-primary btn-sm" (click)="newTicket()"><i class="fa-solid fa-plus me-1"></i>Nouveau ticket</button>
</div>

<div class="row">
  <!-- Control / create -->
  <div class="col-lg-4 mb-3">
    <div class="card mb-3">
      <div class="card-header"><b>Contrôle d'accès</b></div>
      <div class="card-body">
        <label class="form-label small">Saisir / scanner le code du ticket</label>
        <div class="input-group">
          <input class="form-control" placeholder="Ex: DEMO1000" [(ngModel)]="codeToCheck" (keyup.enter)="controler()">
          <button class="btn btn-success" (click)="controler()"><i class="fa-solid fa-check"></i></button>
        </div>
      </div>
    </div>

    <div class="card" *ngIf="showForm">
      <div class="card-header"><b>Nouveau ticket</b></div>
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label small">Bénéficiaire (client lié, optionnel)</label>
          <select class="form-select" [(ngModel)]="form.client.id">
            <option [ngValue]="undefined">— Saisie libre —</option>
            <option *ngFor="let c of clients" [ngValue]="c.id">{{ c.nom }} {{ c.prenom }}</option>
          </select>
        </div>
        <div class="mb-2" *ngIf="!form.client?.id">
          <label class="form-label small">Nom du bénéficiaire</label>
          <input class="form-control" [(ngModel)]="form.beneficiaire">
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label small">Type</label>
            <select class="form-select" [(ngModel)]="form.typeRepas">
              <option>PETIT_DEJEUNER</option><option>DEJEUNER</option><option>DINER</option>
            </select>
          </div>
          <div class="col-6"><label class="form-label small">Personnes</label><input type="number" class="form-control" [(ngModel)]="form.nbPersonnes"></div>
          <div class="col-6"><label class="form-label small">Date</label><input type="date" class="form-control" [(ngModel)]="form.dateRepas"></div>
          <div class="col-6"><label class="form-label small">Montant (auto si 0)</label><input type="number" class="form-control" [(ngModel)]="form.montant"></div>
        </div>
        <button class="btn btn-primary btn-sm w-100 mt-3" (click)="save()">Créer le ticket</button>
      </div>
    </div>
  </div>

  <!-- List -->
  <div class="col-lg-8 mb-3">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <b>Liste des tickets</b>
        <div class="d-flex gap-2">
          <input type="date" class="form-control form-control-sm" [(ngModel)]="filterDate" (change)="load()">
          <button class="btn btn-outline-secondary btn-sm" (click)="filterDate='';load()">Tout</button>
        </div>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-hover align-middle">
          <thead><tr><th>N°</th><th>Bénéficiaire</th><th>Type</th><th>Date</th><th>Montant</th><th>Statut</th><th></th></tr></thead>
          <tbody>
            <tr *ngFor="let t of tickets">
              <td><b>{{ t.numero }}</b><div class="small text-muted">{{ t.code }}</div></td>
              <td>{{ t.beneficiaire }}</td>
              <td>{{ t.typeRepas }}</td>
              <td>{{ t.dateRepas }}</td>
              <td>{{ t.montant | number:'1.0-0' }} DA</td>
              <td><span class="badge" [ngClass]="statutBadge(t.statut)">{{ t.statut }}</span></td>
              <td class="text-nowrap">
                <button class="btn btn-outline-dark btn-sm me-1" (click)="imprimer(t)" title="Imprimer"><i class="fa-solid fa-print"></i></button>
                <button class="btn btn-outline-success btn-sm me-1" (click)="valider(t)" [disabled]="t.statut!=='VALIDE'" title="Valider"><i class="fa-solid fa-check"></i></button>
                <button class="btn btn-outline-danger btn-sm" (click)="annuler(t)" [disabled]="t.statut==='ANNULE'" title="Annuler"><i class="fa-solid fa-ban"></i></button>
              </td>
            </tr>
            <tr *ngIf="!tickets.length"><td colspan="7" class="text-center text-muted">Aucun ticket.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
