<div class="d-flex align-items-center justify-content-between mb-3">
  <h5 class="mb-0">Check-in / Séjours</h5>
  <button class="btn btn-primary btn-sm" (click)="newWalkIn()"><i class="fa-solid fa-plus me-1"></i>Check-in direct</button>
</div>

<div class="card mb-3" *ngIf="showForm">
  <div class="card-header"><b>Check-in direct (sans réservation)</b></div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-5">
        <label class="form-label">Client</label>
        <select class="form-select" [(ngModel)]="form.client.id">
          <option *ngFor="let c of clients" [value]="c.id">{{ c.nom }} {{ c.prenom }}</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Chambre libre</label>
        <select class="form-select" [(ngModel)]="form.chambre.id">
          <option *ngFor="let c of chambres" [value]="c.id">{{ c.numero }} — {{ c.typeChambre?.libelle }}</option>
        </select>
      </div>
      <div class="col-md-3"><label class="form-label">Montant (DA)</label><input type="number" class="form-control" [(ngModel)]="form.montant"></div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary btn-sm me-2" (click)="save()">Valider le check-in</button>
      <button class="btn btn-light btn-sm" (click)="showForm=false">Annuler</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body table-responsive">
    <table class="table table-hover align-middle">
      <thead><tr><th>Client</th><th>Chambre</th><th>Check-in</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let s of sejours">
          <td>{{ s.client?.nom }} {{ s.client?.prenom }}</td>
          <td>{{ s.chambre?.numero }}</td>
          <td>{{ s.dateCheckin | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ s.montant | number:'1.0-0' }} DA</td>
          <td><span class="badge" [ngClass]="s.statut==='EN_COURS'?'bg-success':'bg-secondary'">{{ s.statut }}</span></td>
          <td>
            <button class="btn btn-outline-danger btn-sm" (click)="checkout(s)" [disabled]="s.statut!=='EN_COURS'">
              <i class="fa-solid fa-right-from-bracket me-1"></i>Check-out
            </button>
          </td>
        </tr>
        <tr *ngIf="!sejours.length"><td colspan="6" class="text-center text-muted">Aucun séjour.</td></tr>
      </tbody>
    </table>
  </div>
</div>
